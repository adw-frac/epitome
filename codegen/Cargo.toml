[package]
name = "draconian-codegen"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/andy-thomason/draconian-measurement"
description = "Instruction selection from machine descriptions written in LLVM IR, register allocation, and assembly, binary and disassembly output"

[dependencies]
draconian-ir = { path = "../ir" }

[[bin]]
name = "draconian-llc"
path = "src/main.rs"

[dev-dependencies]
draconian-opt = { path = "../opt" }
