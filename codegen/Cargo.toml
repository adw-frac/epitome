[package]
name = "epitome-codegen"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/andy-thomason/epitome"
description = "Instruction selection from machine descriptions written in LLVM IR, register allocation, and assembly, binary and disassembly output"

[dependencies]
epitome-ir = { path = "../ir" }

[[bin]]
name = "epitome-llc"
path = "src/main.rs"

[[bin]]
name = "epitome-as"
path = "src/bin/epitome-as.rs"

[[bin]]
name = "epitome-objdump"
path = "src/bin/epitome-objdump.rs"

[dev-dependencies]
epitome-opt = { path = "../opt" }
